# Configuración v3 - Comida Mexicana
# EfficientNet-B0 + 121 clases (101 Food-101 + 20 mexicanas)

version: v3_mexican
model_name: efficientnet_b0

# Datos
num_classes: 121  # 101 + 20 mexicanas
image_size: 224

# Entrenamiento
batch_size: 64
num_epochs: 15
learning_rate: 0.0003
lr_backbone: 0.00003
weight_decay: 0.0001

# Transfer learning
freeze_backbone_epochs: 0  # Fine-tuning completo desde inicio
unfreeze_after: 0

# Regularización
label_smoothing: 0.1
mixup_alpha: 0.2
random_erasing_prob: 0.25

# Early stopping
early_stop_patience: 6
checkpoint_every: 5

# Data augmentation
random_crop_scale: [0.08, 1.0]
color_jitter: 0.3
random_rotation: 15

# Dataset
dataset_base: food-101
dataset_custom: mexican_food
custom_classes:
  - caldo_de_pollo
  - tacos_dorados
  - sopes
  - tamales
  - pozole
  - chilaquiles
  - gorditas
  - tlacoyos
  - elote
  - torta_mexicana
  - molletes
  - huevos_rancheros
  - arroz_rojo
  - frijoles
  - carne_en_su_jugo
  - birria
  - menudo
  - flautas
  - mole
  - chiles_rellenos
